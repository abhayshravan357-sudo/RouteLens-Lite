name: RouteLens checks

# The same checks the orchestrator runs locally, so a push cannot
# quietly break something the developer's machine accepts.
#
# The browser checks are a separate job because they need a Chromium
# and a running backend and frontend. They are not allowed to fail the
# build on their own: a flaky browser must not block a merge.

on:
  push:
    branches: [main, "integration/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run the test suite
        working-directory: backend
        run: |
          . .venv/bin/activate
          python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx playwright
          cd ../frontend
          npm ci

      - name: Install the browser
        run: python -m playwright install --with-deps chromium

      - name: Start the backend
        working-directory: backend
        run: |
          . .venv/bin/activate
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done

      - name: Start the frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ && break
            sleep 1
          done

      - name: Run the browser checks
        working-directory: backend
        env:
          ROUTELENS_URL: http://127.0.0.1:5173
          ROUTELENS_HEALTH: http://127.0.0.1:8000/health
        run: |
          . .venv/bin/activate
          python -m pytest tests/test_e2e_browser.py -q -p no:cacheprovider

  whitespace:
    name: Whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for whitespace errors
        run: git diff --check ${{ github.event.before }} ${{ github.sha }}
