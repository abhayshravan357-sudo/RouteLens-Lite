name: RouteLens checks

# Run the project checks on pushes and pull requests.
# Browser checks remain non-blocking, as in the existing workflow.

on:
  push:
    branches: [main, "integration/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio httpx

      - name: Run the test suite
        working-directory: backend
        run: |
          . .venv/bin/activate
          python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio httpx playwright

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: backend
        run: |
          . .venv/bin/activate
          python -m playwright install --with-deps chromium

      - name: Start the backend
        working-directory: backend
        run: |
          . .venv/bin/activate
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          exit 1

      - name: Start the frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173/; then
              exit 0
            fi
            sleep 1
          done
          echo "Frontend failed to start"
          exit 1

      - name: Run the browser checks
        working-directory: backend
        env:
          ROUTELENS_URL: http://127.0.0.1:5173
          ROUTELENS_HEALTH: http://127.0.0.1:8000/health
        run: |
          . .venv/bin/activate
          python -m pytest tests/test_e2e_browser.py -q -p no:cacheprovider

  whitespace:
    name: Whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for whitespace errors
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$EVENT_BEFORE"
          fi

          # A new branch or initial push can have an all-zero "before" SHA.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit unavailable; checking the latest commit instead."
            git diff-tree --check --root --no-commit-id -r "$EVENT_SHA"
          else
            git diff --check "$BASE_SHA" "$EVENT_SHA"
          fi
