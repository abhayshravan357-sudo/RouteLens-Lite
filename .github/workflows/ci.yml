name: RouteLens checks

# Backend and frontend checks, plus optional browser tests.
# Browser test failures do not block merging.

on:
  push:
    branches:
      - main
      - "integration/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        working-directory: backend
        run: |
          . .venv/bin/activate
          python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio httpx playwright

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: backend
        run: |
          . .venv/bin/activate
          python -m playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        run: |
          . .venv/bin/activate
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/routelens-backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/health; then
            cat /tmp/routelens-backend.log
            exit 1
          fi

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/routelens-frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173/; then
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:5173/; then
            cat /tmp/routelens-frontend.log
            exit 1
          fi

      - name: Run browser tests
        working-directory: backend
        env:
          ROUTELENS_URL: http://127.0.0.1:5173
          ROUTELENS_HEALTH: http://127.0.0.1:8000/health
        run: |
          . .venv/bin/activate
          python -m pytest tests/test_e2e_browser.py -q -p no:cacheprovider

  whitespace:
    name: Whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git diff --check "${BASE_SHA}...${HEAD_SHA}"
            else
              echo "PR base commit unavailable; checking the latest commit."
              git diff-tree --check --root --no-commit-id -r "${HEAD_SHA}"
            fi
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit unavailable; checking the latest commit."
            git diff-tree --check --root --no-commit-id -r "${HEAD_SHA}"
          else
            git diff --check "${BEFORE_SHA}" "${HEAD_SHA}"
          fi
